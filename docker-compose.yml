version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - TORCH_HOME=/app/torch_cache
    volumes:
      - ./backend/dataset:/app/dataset
      - ./backend/models:/app/models
      - torch_cache:/app/torch_cache
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NODE_ENV=production
    depends_on:
      - backend
    restart: always

volumes:
  torch_cache:
    driver: local
